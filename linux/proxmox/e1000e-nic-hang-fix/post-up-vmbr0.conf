# Snippet to paste into the "iface vmbr0 inet static" stanza of
# /etc/network/interfaces, right after bridge-fd 0.
#
# Fixes the e1000e "Detected Hardware Unit Hang" on the Intel 82579LM (a known
# driver/firmware bug with TSO/GSO/EEE enabled). See README.md in this folder.
	post-up /usr/sbin/ethtool -K eno1 tso off gso off gro off sg off
	post-up /usr/sbin/ethtool --set-eee eno1 eee off
	post-up /usr/sbin/ethtool -G eno1 rx 4096 tx 4096
