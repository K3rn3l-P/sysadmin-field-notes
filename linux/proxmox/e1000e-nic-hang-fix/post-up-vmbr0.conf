# Snippet da incollare nella stanza "iface vmbr0 inet static" di
# /etc/network/interfaces, subito dopo bridge-fd 0.
#
# Fix e1000e "Detected Hardware Unit Hang" su Intel 82579LM (bug driver/
# firmware noto con TSO/GSO/EEE attivi). Vedi README.md di questa cartella.
	post-up /usr/sbin/ethtool -K eno1 tso off gso off gro off sg off
	post-up /usr/sbin/ethtool --set-eee eno1 eee off
	post-up /usr/sbin/ethtool -G eno1 rx 4096 tx 4096
