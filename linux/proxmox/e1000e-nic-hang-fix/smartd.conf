# smartd.conf — HP Z420 running Proxmox
#
# WARNING: the /dev/disk/by-id/... paths are specific to the physical disks of a
# given host (serial numbers included). The ones below are placeholders — before
# using this file, regenerate the real paths with:
#   ls -la /dev/disk/by-id/ | grep -E 'ata-|nvme-'
# and substitute them here before copying it to /etc/smartd.conf.
#
# Per-disk configuration instead of the generic DEVICESCAN, to get scheduled
# tests and targeted monitoring. See this folder's README.md for the full
# context (the 1 August 2026 investigation).
#
# -a          monitor everything: health, prefail/usage attributes, error log,
#             self-test log, and report when Pending_Sector (197) or
#             Uncorrectable (198) are non-zero
# -o on       enable the disk's automatic offline data collection
# -S on       enable attribute autosave
# -s ...      schedule a weekly short test and a monthly long test, on different
#             days/times per disk so they don't overlap, and so they stay clear
#             of the Sunday 03:30 vzdump backup window
# -W 4,0,H    warn on a temperature jump >=4C, or above H degrees
# -m root -M exec ...   local mail to root through the standard Debian script
#             (forwarding to an external address needs an SMTP relay configured
#             in postfix: not covered here, that's a separate step)

# Seagate ST4000DM004 4TB (SMR) — /mnt/4TB, TB4 backup storage.
# Weak point: 188 Command_Timeout, 183 Runtime_Bad_Block=5, 199 UDMA_CRC_Error_Count=1 (cable)
/dev/disk/by-id/ata-ST4000DM004-2CV104_XXXXXXXX -a -o on -S on -s (S/../../2/04|L/../15/../03) -m root -M exec /usr/share/smartmontools/smartd-runner

# Samsung SSD 850 EVO 250GB — system disk (root/swap/a VM), ~80TB written
# against a rated TBW of 75TB. Weak point: 177 Wear_Leveling_Count, 199 CRC_Error_Count=5
/dev/disk/by-id/ata-Samsung_SSD_850_EVO_250GB_XXXXXXXXXXXXXXX -a -o on -S on -s (S/../../3/04|L/../16/../03) -m root -M exec /usr/share/smartmontools/smartd-runner

# TEAM T253 240GB — VM disk pool.
# The healthiest of the group (every counter at zero), monitored for continuity.
/dev/disk/by-id/ata-TEAM_T253240GB_XXXXXXXXXXXXXXXXXXXX -a -o on -S on -s (S/../../4/04|L/../17/../03) -m root -M exec /usr/share/smartmontools/smartd-runner

# Crucial BX500 240GB — VM disk pool (GPU/LLM workloads).
# Weak point: historic peak of 87C (min/max 27/87), 83% life remaining (attribute 202).
# Temperature alarm threshold at 55C: well under spec (~70C) and far below the
# historic peak, so an airflow problem gets caught early.
/dev/disk/by-id/ata-CT240BX500SSD1_XXXXXXXXXXXX -a -o on -S on -s (S/../../5/04|L/../18/../03) -W 4,0,55 -m root -M exec /usr/share/smartmontools/smartd-runner
