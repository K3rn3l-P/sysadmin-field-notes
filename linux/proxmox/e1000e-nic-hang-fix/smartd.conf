# smartd.conf — HP Z420 Proxmox (pvm)
#
# ATTENZIONE: i path /dev/disk/by-id/... sono specifici dei dischi fisici di
# QUESTO host (numeri di serie inclusi). In caso di reinstallazione su hardware
# diverso o con dischi diversi, rigenera i path con:
#   ls -la /dev/disk/by-id/ | grep -E 'ata-|nvme-'
# e sostituiscili in questo file prima di copiarlo in /etc/smartd.conf.
#
# Configurazione per-disco al posto del DEVICESCAN generico, per avere
# test pianificati e monitoraggio mirato. Vedi README.md di questa cartella
# per il contesto completo (diagnosi dell'1 agosto 2026).
#
# -a          monitora tutto: salute, attributi prefail/usage, error log,
#             self-test log, e riporta se Pending_Sector (197) o
#             Uncorrectable (198) sono diversi da zero
# -o on       attiva l'offline data collection automatica del disco
# -S on       attiva l'autosave degli attributi
# -s ...      pianifica uno short test settimanale e un long test mensile,
#             su giorni/orari diversi per disco per non sovrapporli e per
#             restare fuori dalla finestra del backup vzdump di domenica 03:30
# -W 4,0,H    avvisa su salto di temperatura >=4C o sopra H gradi
# -m root -M exec ...   mail locale a root via lo script standard Debian
#             (per inoltro a un indirizzo esterno serve configurare un
#             relay SMTP in postfix: non incluso qui, e' un passo separato)

# Seagate ST4000DM004 4TB (SMR) — /mnt/4TB, storage backup TB4.
# Punto debole: 188 Command_Timeout, 183 Runtime_Bad_Block=5, 199 UDMA_CRC_Error_Count=1 (cavo)
/dev/disk/by-id/ata-ST4000DM004-2CV104_ZFN31V5S -a -o on -S on -s (S/../../2/04|L/../15/../03) -m root -M exec /usr/share/smartmontools/smartd-runner

# Samsung SSD 850 EVO 250GB — disco di sistema (root/swap/VM 200), ~80TB scritti
# su TBW nominale 75TB. Punto debole: 177 Wear_Leveling_Count, 199 CRC_Error_Count=5
/dev/disk/by-id/ata-Samsung_SSD_850_EVO_250GB_S3R0NF1J821052F -a -o on -S on -s (S/../../3/04|L/../16/../03) -m root -M exec /usr/share/smartmontools/smartd-runner

# TEAM T253 240GB — pool TM240, dischi delle VM 400/401/403/203/102.
# Il piu' sano del gruppo (tutti i contatori a zero), monitorato per continuita'.
/dev/disk/by-id/ata-TEAM_T253240GB_TPBF2302100010302375 -a -o on -S on -s (S/../../4/04|L/../17/../03) -m root -M exec /usr/share/smartmontools/smartd-runner

# Crucial BX500 240GB — pool CT-240, VM 100 (GPU/LLM) e 101.
# Punto debole: picco storico 87C (min/max 27/87), 83% vita residua (attributo 202).
# Soglia di allarme temperatura a 55C: ben sotto lo spec (~70C) e molto sotto il
# picco storico, per intercettare un problema di flusso d'aria per tempo.
/dev/disk/by-id/ata-CT240BX500SSD1_2017E3F8F673 -a -o on -S on -s (S/../../5/04|L/../18/../03) -W 4,0,55 -m root -M exec /usr/share/smartmontools/smartd-runner
